<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="carte">
    <h1>🔒 Panneau admin</h1>

    <label for="adresses">Adresses e-mail <small>(copiées depuis ton tableau de bord Formspree, une par ligne ou séparées par des virgules)</small></label>
    <textarea id="adresses" rows="6" placeholder="exemple1@mail.com&#10;exemple2@mail.com"></textarea>
    <div class="compteur"><span id="compte">0</span> adresse(s) valide(s)</div>

    <hr>

    <label for="objet">Objet du mail</label>
    <input type="text" id="objet" value="🎉 C’est bon, le site est en ligne !">

    <label for="message">Message</label>
    <textarea id="message" rows="10">Salut ! 👋

Le moment tant attendu est enfin arrivé : le site est officiellement en ligne et hébergé ! 🚀

Tu peux dès maintenant venir le découvrir ici :
[Insère ton lien ici]

Merci d’avoir patienté et d’avoir suivi le projet depuis le début. À très vite !

— L’équipe</textarea>

    <button id="envoyer" class="bleu">Ouvrir dans ma messagerie 📨</button>
    <button id="copier">Copier les adresses 📋</button>
    <div id="info" class="info" hidden></div>
  </main>
  <script src="admin.js"></script>
</body>
</html>
